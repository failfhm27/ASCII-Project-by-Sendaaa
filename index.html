<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Video Player</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #000;
            color: #E2B4BD;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: monospace;
        }

        #player-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 90vh;
        }

        
        #ascii-container {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            line-height: 0.52;
            letter-spacing: -0.5px;
            white-space: pre;
            font-size: 6px; 
            text-align: center;
            user-select: none;
        }

        #lyrics-overlay {
            position: absolute;
            top: 84%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem;
            font-family: 'Arial', sans-serif;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            pointer-events: none;
            width: 90%;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 
                0 0 7px #fff,
                0 0 15px #E2B4BD,
                0 0 30px #E2B4BD;
        }

        video { display: none; }

        button {
            margin-top: 5px;
            padding: 10px 24px;
            background: #E2B4BD;
            color: #000;
            border: none;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 0 12px rgba(226, 180, 189, 0.4);
        }
    </style>
</head>
<body>

    <div id="player-wrapper">
        <div id="ascii-container"></div>
        <div id="lyrics-overlay"></div>
    </div>
    
    <video id="webcam" src="tes.mp4" playsinline></video>
    <button id="play-btn">PLAY</button>

    
    <canvas id="canvas" width="95" height="85" style="display:none;"></canvas>

    <script src="script.js"></script>
</body>
</html>
